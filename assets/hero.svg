<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ruslan Labinski — Game Developer, Web Developer, Maker">
  <defs>
    <style>
      .name    { font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 62px; letter-spacing: 5px; }
      .sub     { font-family: Arial, Helvetica, sans-serif; font-weight: 400; font-size: 22px; letter-spacing: 1.5px; fill: #94a3b8; }
      .mono    { font-family: "SF Mono", Consolas, "Courier New", monospace; font-size: 19px; }
      .badge   { font-family: Consolas, "Courier New", monospace; font-weight: 500; font-size: 15px; letter-spacing: 2.5px; fill: #cbd5e1; }

      @keyframes drift  { 0%,100% { transform: translate(0,0);      } 50% { transform: translate(30px,-20px); } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0);      } 50% { transform: translate(-26px,18px); } }
      @keyframes bob    { 0%,100% { transform: translateY(0);       } 50% { transform: translateY(-8px);      } }
      @keyframes bob2   { 0%,100% { transform: translateY(0);       } 50% { transform: translateY(7px);       } }
      @keyframes twinkle{ 0%,100% { opacity: .15; } 50% { opacity: 1; } }
      @keyframes blink  { 0%,49%  { opacity: 1;   } 50%,100% { opacity: 0; } }
      @keyframes breathe{ 0%,100% { opacity: .30; } 50% { opacity: .65; } }
      @keyframes pulse  { 0%,100% { opacity: 1;   } 50% { opacity: .3; } }
      @keyframes draw   { from { stroke-dashoffset: 120; opacity: 0; } to { stroke-dashoffset: 0; opacity: 1; } }
      @keyframes rise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes gridpan{ from { transform: translate(0,0); } to { transform: translate(40px,0); } }

      .orb1  { animation: drift  14s ease-in-out infinite; }
      .orb2  { animation: drift2 17s ease-in-out infinite; }
      .glow  { animation: breathe 4s ease-in-out infinite; }
      .grid  { animation: gridpan 12s linear infinite; }
      .cur   { animation: blink 1s step-end infinite; }
      .dot   { animation: pulse 1.9s ease-in-out infinite; }
      .hud   { stroke-dasharray: 120; animation: draw 1.1s ease-out forwards; }
      .in1   { opacity: 0; animation: rise .7s ease-out .15s forwards; }
      .in2   { opacity: 0; animation: rise .7s ease-out .35s forwards; }
      .in3   { opacity: 0; animation: rise .7s ease-out .55s forwards; }
      .in4   { opacity: 0; animation: rise .7s ease-out .75s forwards; }
      .p1 { animation: bob  5.0s ease-in-out infinite, twinkle 3.1s ease-in-out infinite; }
      .p2 { animation: bob2 6.2s ease-in-out infinite, twinkle 2.4s ease-in-out infinite; }
      .p3 { animation: bob  4.4s ease-in-out infinite, twinkle 3.8s ease-in-out infinite; }
      .p4 { animation: bob2 7.0s ease-in-out infinite, twinkle 2.9s ease-in-out infinite; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0e17"/>
      <stop offset="55%"  stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>

    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%"  stop-color="#93a3b8"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#93a3b8"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-620 0; 620 0; -620 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#94a3b8" fill-opacity="0.10"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="card"><rect width="1200" height="360" rx="26"/></clipPath>

    <!-- typewriter reveal windows, 12s loop, 3 phrases -->
    <clipPath id="typ0"><rect x="408" y="262" height="30" width="0">
      <animate attributeName="width" values="0;376;376;0;0" keyTimes="0;.10;.267;.317;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="typ1"><rect x="408" y="262" height="30" width="0">
      <animate attributeName="width" values="0;0;342;342;0;0" keyTimes="0;.333;.433;.60;.65;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="typ2"><rect x="408" y="262" height="30" width="0">
      <animate attributeName="width" values="0;0;308;308;0;0" keyTimes="0;.667;.767;.933;.983;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <g class="grid"><rect x="-40" width="1280" height="360" fill="url(#dots)"/></g>

    <circle class="orb1" cx="150" cy="80"  r="250" fill="url(#orbCyan)"/>
    <circle class="orb2" cx="1060" cy="300" r="270" fill="url(#orbViolet)"/>

    <!-- floating particles -->
    <circle class="p1" cx="168"  cy="72"  r="3.5" fill="#22d3ee"/>
    <circle class="p2" cx="1042" cy="60"  r="3"   fill="#a855f7"/>
    <circle class="p3" cx="96"   cy="268" r="2.5" fill="#a855f7"/>
    <circle class="p4" cx="1128" cy="242" r="3.5" fill="#22d3ee"/>
    <circle class="p2" cx="264"  cy="316" r="2"   fill="#22d3ee"/>
    <circle class="p3" cx="948"  cy="150" r="2"   fill="#a855f7"/>
    <circle class="p1" cx="1150" cy="110" r="2.5" fill="#4ade80"/>
    <circle class="p4" cx="58"   cy="150" r="2"   fill="#22d3ee"/>

    <!-- HUD corner brackets -->
    <g fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
      <path class="hud" d="M28 68 V38 A10 10 0 0 1 38 28 H68"/>
      <path class="hud" d="M1132 28 H1162 A10 10 0 0 1 1172 38 V68"/>
      <path class="hud" d="M1172 292 V322 A10 10 0 0 1 1162 332 H1132"/>
      <path class="hud" d="M68 332 H38 A10 10 0 0 1 28 322 V292"/>
    </g>

    <rect width="1200" height="360" rx="26" fill="none" stroke="#94a3b8" stroke-opacity="0.16" stroke-width="1.5"/>

    <!-- status badge -->
    <g class="in1" transform="translate(600,66)">
      <rect x="-186" y="-17" width="372" height="34" rx="17" fill="none" stroke="#4ade80" stroke-width="1.6" filter="url(#soft2)" class="glow"/>
      <rect x="-186" y="-17" width="372" height="34" rx="17" fill="#ffffff" fill-opacity="0.045" stroke="#94a3b8" stroke-opacity="0.25"/>
      <circle class="dot" cx="-162" cy="0" r="4.5" fill="#4ade80"/>
      <text class="badge" x="10" y="5" text-anchor="middle">GAME DEV · WEB DEV · MAKER</text>
    </g>

    <!-- name -->
    <g class="in2">
      <text class="name glow" x="600" y="168" text-anchor="middle" fill="#ffffff" filter="url(#soft)">RUSLAN LABINSKI</text>
      <text class="name"      x="600" y="168" text-anchor="middle" fill="url(#shine)">RUSLAN LABINSKI</text>
    </g>

    <!-- subtitle -->
    <text class="sub in3" x="600" y="212" text-anchor="middle">Prague · building games, websites and things that blink</text>

    <!-- terminal strip with typewriter -->
    <g class="in4">
      <rect x="300" y="248" width="600" height="58" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#94a3b8" stroke-opacity="0.20"/>
      <circle cx="322" cy="264" r="3.5" fill="#ef4444" fill-opacity="0.75"/>
      <circle cx="334" cy="264" r="3.5" fill="#eab308" fill-opacity="0.75"/>
      <circle cx="346" cy="264" r="3.5" fill="#4ade80" fill-opacity="0.75"/>
      <text class="mono" x="322" y="292" fill="#4ade80">~/dev</text>
      <text class="mono" x="386" y="292" fill="#64748b">$</text>

      <g clip-path="url(#typ0)"><text class="mono" x="408" y="292" fill="#e2e8f0">shipping games at Tvořiště s.r.o.</text></g>
      <g clip-path="url(#typ1)"><text class="mono" x="408" y="292" fill="#e2e8f0">building web things end-to-end</text></g>
      <g clip-path="url(#typ2)"><text class="mono" x="408" y="292" fill="#e2e8f0">soldering things that blink</text></g>

      <rect class="cur" y="276" width="10" height="20" fill="#22d3ee" x="408">
        <animate attributeName="x"
                 values="408;784;784;408;408;750;750;408;408;716;716;408;408"
                 keyTimes="0;.10;.267;.317;.333;.433;.60;.65;.667;.767;.933;.983;1"
                 dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
