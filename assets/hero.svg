<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#c7d2e0"/>
      <stop offset="42%" stop-color="#c7d2e0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#c7d2e0"/>
      <stop offset="100%" stop-color="#c7d2e0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-500 0;500 0;-500 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#0e1420"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="280" rx="24"/>
    </clipPath>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="badgeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="280" fill="url(#cardBg)"/>

    <circle cx="120" cy="70" r="220" fill="url(#glowTeal)">
      <animate attributeName="r" values="200;240;200" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="120;160;120" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="220" r="240" fill="url(#glowPurple)">
      <animate attributeName="r" values="220;260;220" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1080;1040;1080" dur="12s" repeatCount="indefinite"/>
    </circle>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite"/>
      <circle cx="150" cy="60" r="4" fill="#22d3ee">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="4.6s" begin="0.3s" repeatCount="indefinite"/>
      <circle cx="1060" cy="70" r="3" fill="#a855f7">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>
      <circle cx="90" cy="210" r="3" fill="#a855f7">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
      <circle cx="1120" cy="200" r="4" fill="#22d3ee">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="0" y="0" width="1200" height="280" rx="24" fill="none" stroke="rgba(148,163,184,0.18)" stroke-width="1.5"/>

    <g transform="translate(600,52)">
      <rect x="-172" y="-16" width="344" height="32" rx="16" fill="none" stroke="#4ade80" stroke-width="1.5" filter="url(#badgeGlow)" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="-172" y="-16" width="344" height="32" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(148,163,184,0.25)"/>
      <circle cx="-150" cy="0" r="4" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="4" y="5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#c7d2e0">GAME DEV · WORDPRESS · MAKER</text>
    </g>

    <text x="600" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="50" letter-spacing="5" fill="#ffffff" filter="url(#softGlow)" opacity="0.5">
      RUSLAN LABINSKI
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="50" letter-spacing="5" fill="url(#titleGrad)">RUSLAN LABINSKI</text>

    <text x="600" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="1" fill="#94a3b8">Game Developer · Web Developer · Hardware Tinkerer</text>

    <line x1="470" y1="216" x2="730" y2="216" stroke="rgba(148,163,184,0.15)" stroke-width="1"/>
    <line x1="600" y1="216" x2="600" y2="216" stroke="#22d3ee" stroke-width="1.5">
      <animate attributeName="x1" values="600;470;470" dur="1.6s" fill="freeze"/>
      <animate attributeName="x2" values="600;730;730" dur="1.6s" fill="freeze"/>
      <animate attributeName="stroke-opacity" values="1;1;0.4" dur="1.6s" fill="freeze"/>
    </line>

    <text x="600" y="245" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#64748b">Shipping small web + game projects, one commit at a time.</text>

    <rect x="1148" y="230" width="9" height="15" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
