<svg viewBox="0 0 1200 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pill { fill: rgba(255,255,255,0.04); stroke-width: 1.4; }
      .label { font-family: Consolas, 'Courier New', monospace; font-size: 15px; fill: #e2e8f0; }
    </style>
    <radialGradient id="stackGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stackGlowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="stackClip">
      <rect x="0" y="0" width="1200" height="190" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#stackClip)">
    <rect x="0" y="0" width="1200" height="190" fill="rgba(255,255,255,0.015)"/>
    <circle cx="80" cy="20" r="180" fill="url(#stackGlowA)"/>
    <circle cx="1140" cy="180" r="220" fill="url(#stackGlowB)"/>
    <rect x="0" y="0" width="1200" height="190" rx="24" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1.5"/>

    <!-- Row 1 -->
    <g transform="translate(347,40)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0s" fill="freeze"/>
      <rect class="pill" width="142" height="44" rx="22" stroke="rgba(33,117,155,0.55)"/>
      <circle cx="22" cy="22" r="5" fill="#21759B"><animate attributeName="r" values="5;6.5;5" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <text class="label" x="36" y="27">WordPress</text>
    </g>
    <g transform="translate(509,40)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.08s" fill="freeze"/>
      <rect class="pill" width="86" height="44" rx="22" stroke="rgba(119,123,180,0.55)"/>
      <circle cx="22" cy="22" r="5" fill="#777BB4"><animate attributeName="r" values="5;6.5;5" dur="2.7s" begin="0.5s" repeatCount="indefinite"/></circle>
      <text class="label" x="36" y="27">PHP</text>
    </g>
    <g transform="translate(615,40)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.16s" fill="freeze"/>
      <rect class="pill" width="114" height="44" rx="22" stroke="rgba(20,184,166,0.55)"/>
      <circle cx="22" cy="22" r="5" fill="#14B8A6"><animate attributeName="r" values="5;6.5;5" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
      <text class="label" x="36" y="27">WPCode</text>
    </g>
    <g transform="translate(749,40)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.24s" fill="freeze"/>
      <rect class="pill" width="105" height="44" rx="22" stroke="rgba(227,79,38,0.55)"/>
      <circle cx="22" cy="22" r="5" fill="#E34F26"><animate attributeName="r" values="5;6.5;5" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
      <text class="label" x="36" y="27">HTML5</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(382,104)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.32s" fill="freeze"/>
      <rect class="pill" width="95" height="44" rx="22" stroke="rgba(21,114,182,0.55)"/>
      <circle cx="22" cy="22" r="5" fill="#1572B6"><animate attributeName="r" values="5;6.5;5" dur="2.5s" begin="1.1s" repeatCount="indefinite"/></circle>
      <text class="label" x="36" y="27">CSS3</text>
    </g>
    <g transform="translate(497,104)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze"/>
      <rect class="pill" width="151" height="44" rx="22" stroke="rgba(247,223,30,0.55)"/>
      <circle cx="22" cy="22" r="5" fill="#F7DF1E"><animate attributeName="r" values="5;6.5;5" dur="2.9s" begin="1.3s" repeatCount="indefinite"/></circle>
      <text class="label" x="36" y="27">JavaScript</text>
    </g>
    <g transform="translate(668,104)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.48s" fill="freeze"/>
      <rect class="pill" width="151" height="44" rx="22" stroke="rgba(217,119,87,0.55)"/>
      <circle cx="22" cy="22" r="5" fill="#D97757"><animate attributeName="r" values="5;6.5;5" dur="3.2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <text class="label" x="36" y="27">Claude API</text>
    </g>
  </g>
</svg>
