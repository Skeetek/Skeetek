<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pill { fill: rgba(255,255,255,0.05); stroke-width: 1.4; }
      .label { font-family: Consolas, 'Courier New', monospace; font-size: 15px; fill: #e2e8f0; }
    </style>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <radialGradient id="stackGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stackGlowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="stackClip">
      <rect x="0" y="0" width="760" height="240" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#stackClip)">
    <rect x="0" y="0" width="760" height="240" fill="rgba(255,255,255,0.015)"/>
    <circle cx="50" cy="15" r="130" fill="url(#stackGlowA)"/>
    <circle cx="715" cy="225" r="150" fill="url(#stackGlowB)"/>
    <rect x="0" y="0" width="760" height="240" rx="20" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1.5"/>

    <!--
      Pill template per item:
      outer <g translate(x,y)> handles entrance fade + fixed position
      inner <g> handles continuous float bob
      glow rect (blurred, pulsing) sits behind the crisp pill rect
    -->

    <!-- Row 1 -->
    <g transform="translate(51,34)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" begin="0.2s" repeatCount="indefinite"/>
        <rect width="151" height="44" rx="22" fill="none" stroke="#3178C6" stroke-width="2" filter="url(#glow)" opacity="0.35"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></rect>
        <rect class="pill" width="151" height="44" rx="22" stroke="rgba(49,120,198,0.6)"/>
        <circle cx="22" cy="22" r="5" fill="#3178C6"><animate attributeName="r" values="5;6.5;5" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
        <text class="label" x="36" y="27">TypeScript</text>
