<svg viewBox="0 0 150 52" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LinkedIn">
  <defs>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 600; fill: #e2e8f0; }
      @keyframes breathe { 0%,100% { opacity:.25 } 50% { opacity:.75 } }
      @keyframes beat    { 0%,100% { transform: scale(1) } 50% { transform: scale(1.1) } }
      .gl { animation: breathe 2.8s ease-in-out infinite .2s; }
      .ic { animation: beat 3.2s ease-in-out infinite; transform-origin: 27px 24px; }
    </style>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect class="gl" opacity=".45" x="1.5" y="1.5" width="147" height="49" rx="24.5" fill="none" stroke="#0A66C2" stroke-width="2.4" filter="url(#b)"/>
  <rect x="1.5" y="1.5" width="147" height="49" rx="24.5" fill="#0d1220" stroke="#0A66C2" stroke-opacity=".5" stroke-width="1.4"/>
  <g class="ic">
    <rect x="18" y="15" width="18" height="18" rx="4" fill="#0A66C2"/>
    <text x="27" y="27.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="12" fill="#ffffff">in</text>
  </g>
  <text class="t" x="46" y="31">LinkedIn</text>
</svg>
