<svg viewBox="0 0 158 52" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Instagram">
  <defs>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 600; fill: #e2e8f0; }
      @keyframes breathe { 0%,100% { opacity:.25 } 50% { opacity:.75 } }
      @keyframes beat    { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }
      .gl { animation: breathe 2.8s ease-in-out infinite .4s; }
      .ic { animation: beat 3.2s ease-in-out infinite; transform-origin: 27px 26px; }
    </style>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9ce34"/><stop offset="45%" stop-color="#ee2a7b"/><stop offset="100%" stop-color="#6228d7"/>
    </linearGradient>
    <filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect class="gl" opacity=".45" x="1.5" y="1.5" width="155" height="49" rx="24.5" fill="none" stroke="#ee2a7b" stroke-width="2.4" filter="url(#b2)"/>
  <rect x="1.5" y="1.5" width="155" height="49" rx="24.5" fill="#0d1220" stroke="#ee2a7b" stroke-opacity=".5" stroke-width="1.4"/>
  <g class="ic" fill="none" stroke="url(#ig)" stroke-width="2.1">
    <rect x="18" y="17" width="18" height="18" rx="5.5"/>
    <circle cx="27" cy="26" r="4.2"/>
  </g>
  <circle cx="32.4" cy="20.6" r="1.4" fill="url(#ig)"/>
  <text class="t" x="46" y="31">Instagram</text>
</svg>
