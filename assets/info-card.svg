<svg viewBox="0 0 460 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ruslan Labinski — Game Developer, Web Developer, Automation Engineer">
  <defs>
    <style>
      .mono { font-family: "SF Mono", Consolas, "Courier New", monospace; font-size: 15px; }
      .key  { fill: #4ade80; }
      .val  { fill: #e2e8f0; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      .dot { animation: pulse 1.9s ease-in-out infinite; }
    </style>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0e17"/>
      <stop offset="55%"  stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
  </defs>

  <rect width="460" height="330" rx="18" fill="url(#cardbg)"/>
  <rect width="460" height="330" rx="18" fill="none" stroke="#94a3b8" stroke-opacity=".16" stroke-width="1.5"/>

  <circle class="dot" cx="424" cy="47" r="4" fill="#4ade80"/>

  <text class="mono" x="24" y="32"><tspan class="key">name:     </tspan><tspan class="val">Ruslan Labinski</tspan></text>

  <text class="mono" x="24" y="56"><tspan class="key">role:     </tspan></text>
  <text class="mono val" x="115" y="56">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.033;.30;.333;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    Game Developer
  </text>
  <text class="mono val" x="115" y="56">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.033;.30;.333;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    Web Developer
  </text>
  <text class="mono val" x="115" y="56">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.033;.30;.333;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    Automation Engineer
  </text>

  <text class="mono key" x="24" y="80">company:</text>
  <text class="mono" x="24" y="104"><tspan class="key">  - </tspan><tspan class="val">Tvořiště s.r.o.</tspan></text>
  <text class="mono" x="24" y="128"><tspan class="key">  - </tspan><tspan class="val">on-boarding co. s.r.o.</tspan></text>
  <text class="mono" x="24" y="152"><tspan class="key">  - </tspan><tspan class="val">Montei cz s.r.o.</tspan></text>

  <text class="mono" x="24" y="176"><tspan class="key">based_in: </tspan><tspan class="val">Czechia</tspan></text>

  <text class="mono key" x="24" y="200">focus:</text>
  <text class="mono" x="24" y="224"><tspan class="key">  - </tspan><tspan class="val">gameplay &amp; tooling</tspan></text>
  <text class="mono" x="24" y="248"><tspan class="key">  - </tspan><tspan class="val">web, end-to-end</tspan></text>
  <text class="mono" x="24" y="272"><tspan class="key">  - </tspan><tspan class="val">embedded tinkering</tspan></text>

  <text class="mono" x="24" y="296"><tspan class="key">fuel:     </tspan><tspan class="val">coffee + solder fumes</tspan></text>
</svg>
