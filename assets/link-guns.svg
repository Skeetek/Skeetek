<svg viewBox="0 0 150 52" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="guns.lol">
  <defs>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 600; fill: #e2e8f0; }
      @keyframes breathe { 0%,100% { opacity:.25 } 50% { opacity:.75 } }
      @keyframes spin    { to { transform: rotate(360deg) } }
      .gl { animation: breathe 2.8s ease-in-out infinite; }
      .rg { animation: spin 9s linear infinite; transform-origin: 27px 26px; }
    </style>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect class="gl" opacity=".45" x="1.5" y="1.5" width="147" height="49" rx="24.5" fill="none" stroke="#22d3ee" stroke-width="2.4" filter="url(#b)"/>
  <rect x="1.5" y="1.5" width="147" height="49" rx="24.5" fill="#0d1220" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.4"/>
  <g class="rg" fill="none" stroke="url(#cg)" stroke-width="2.2" stroke-linecap="round">
    <circle cx="27" cy="26" r="8.5" stroke-dasharray="9 7"/>
  </g>
  <circle cx="27" cy="26" r="3" fill="url(#cg)"/>
  <text class="t" x="46" y="31">guns.lol</text>
</svg>
