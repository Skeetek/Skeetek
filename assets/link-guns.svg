<svg viewBox="0 0 170 46" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gunsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="168" height="44" rx="22" fill="rgba(255,255,255,0.04)" stroke="rgba(34,211,238,0.45)">
    <animate attributeName="stroke-opacity" values="0.45;0.9;0.45" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="30" cy="23" r="8" fill="url(#gunsGrad)">
    <animate attributeName="r" values="8;9.5;8" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="30" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#0b0f1a">◆</text>
  <text x="54" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Links</text>
</svg>
